<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>集計</title>
  </head>
  <body>
    <main>
      <h1>集計</h1>
      <h2 class="result"></h2>
      <textarea class="sumArea" style="height: auto"></textarea>
    </main>
  </body>

  <script defer>
    const resultText = document.querySelector(".result");
    const sumArea = document.querySelector(".sumArea");
    sumArea.addEventListener("change", () => {
      const text = sumArea.value;
      const textList = text.split("\n");
      resultText.innerHTML = textList.reduce(
        (total, num) => parseInt(total) + parseInt(num),
      );
    });
  </script>
</html>
